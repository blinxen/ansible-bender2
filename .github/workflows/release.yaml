name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libseccomp-dev \
            libgpgme-dev \
            libdevmapper-dev \
            libbtrfs-dev \
            libssl-dev \
            libsqlite3-dev \
            pkg-config

      - name: Set up rootless container support
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo usermod --add-subuids 100000-165535 runner
          sudo usermod --add-subgids 100000-165535 runner

      - name: Build
        run: make build

      - name: Create tarball
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE="ansible-bender2-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "${ARCHIVE}" -C bin ansible-bender2
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ansible-bender2-linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Release ${{ github.ref_name }}

            ### Verification

            Verify your download with the SHA256SUMS file:
            ```
            sha256sum -c SHA256SUMS
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for detailed changes.
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
